name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # --- Security scanning -----------------------------------------------------
  # Tool choices are documented in docs/findings.md. Each job produces a raw
  # JSON report (uploaded as an artifact) AND enforces a gate. Gates are scoped
  # to code we own (app/, requirements.txt); notify's out-of-scope issues are
  # tracked in findings.md, not blocked here (see docs/technical-notes.md).

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: pip install semgrep==1.174.0
      - name: SAST report (app + notify)
        run: |
          semgrep --config p/python --config p/javascript --config p/nodejsscan \
            --config p/secrets --config p/security-audit \
            --json --output sast.semgrep.json --metrics=off app notify/src
      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast.semgrep.json
          path: sast.semgrep.json
      - name: Gate — fail on blocking (ERROR) findings in app/
        run: |
          count=$(jq '[.results[] | select(.extra.severity=="ERROR") | select(.path|startswith("app/"))] | length' sast.semgrep.json)
          echo "Blocking SAST findings in app/: $count"
          test "$count" -eq 0

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
      - name: SCA report (all dependencies)
        run: trivy fs --scanners vuln --format json --output sca.trivy.json --skip-dirs .venv --skip-dirs notify/node_modules .
      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca.trivy.json
          path: sca.trivy.json
      - name: Gate — fail on CRITICAL/HIGH in Python dependencies
        run: trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 requirements.txt

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vulntracker-api:ci .
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
      - name: Container image scan
        run: trivy image --format json --output container.trivy.json vulntracker-api:ci
      - name: Upload container report
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: container.trivy.json
      # No hard vuln gate: the critical/high OS CVEs are unfixable base-image
      # packages the app never invokes (see docs/findings.md, F19). Gate instead
      # on secrets/misconfigs baked into the image.
      - name: Gate — no secrets or misconfigurations in the image
        run: trivy image --scanners secret,misconfig --exit-code 1 --severity CRITICAL,HIGH vulntracker-api:ci

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Checkov (not Trivy) scans the Terraform: Trivy's Terraform scanner does
      # not cover the kubernetes provider (verified), so it cannot see these
      # resources. See docs/technical-notes.md.
      - name: Install Checkov
        run: pip install checkov==3.3.15
      - name: IaC report
        run: checkov -d terraform --compact -o json > iac.checkov.json || true
      - name: Upload IaC report
        uses: actions/upload-artifact@v4
        with:
          name: iac.checkov.json
          path: iac.checkov.json
      - name: Gate — fail on unjustified misconfigurations
        run: checkov -d terraform --compact --quiet
